<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>손글씨 해설 노트</title>
  <meta name="description" content="문제 사진을 올리면 AI가 풀어서 사람이 펜으로 쓴 듯한 손글씨 해설지를 만들어 드립니다." />
  <meta name="theme-color" content="#1d3a8a" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✎</span>
      <span>손글씨 해설 노트</span>
    </div>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="h-input">
      <h2 id="h-input" class="section-title"><span class="step">1</span>문제 이미지</h2>

      <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="문제 이미지 선택">
        <img id="source-preview" alt="등록한 문제 이미지" hidden />
        <div id="drop-hint" class="drop-hint">
          <strong>사진을 끌어다 놓거나 눌러서 선택</strong>
          <span>캡처 후 <kbd>Ctrl</kbd>+<kbd>V</kbd> 로 붙여넣기도 됩니다</span>
        </div>
      </div>
      <div class="row-buttons">
        <label class="btn secondary">
          <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
          카메라로 촬영
        </label>
        <label class="btn secondary">
          <input id="file-input" type="file" accept="image/*" hidden />
          파일 선택
        </label>
        <button id="paste-btn" class="btn secondary" type="button">클립보드 붙여넣기</button>
      </div>

      <h2 class="section-title"><span class="step">2</span>풀이 방식</h2>
      <div id="mode-options" class="choice-grid two" role="radiogroup" aria-label="풀이 방식"></div>

      <h2 class="section-title"><span class="step">3</span>펜과 글씨체</h2>
      <div id="pen-options" class="chip-row" role="radiogroup" aria-label="펜 종류"></div>
      <div id="font-options" class="font-grid" role="radiogroup" aria-label="손글씨 폰트"></div>

      <h2 class="section-title"><span class="step">4</span>합성 방식</h2>
      <div id="layout-options" class="choice-grid three" role="radiogroup" aria-label="합성 방식"></div>
      <div id="postit-options" class="chip-row" role="radiogroup" aria-label="포스트잇 색상" hidden></div>

      <button id="generate-btn" class="btn primary big" type="button" disabled>손글씨 해설 만들기</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section class="panel result-panel" aria-labelledby="h-result">
      <div class="result-head">
        <h2 id="h-result" class="section-title">완성된 해설지</h2>
        <div class="result-actions">
          <button id="rewrite-btn" class="btn secondary small" type="button" disabled title="같은 풀이를 새로운 필체 흔들림으로 다시 씁니다">다시 쓰기</button>
          <a id="download-btn" class="btn primary small disabled" download="손글씨_해설노트.png" aria-disabled="true">저장</a>
        </div>
      </div>
      <div id="result-box" class="result-box">
        <div id="result-empty" class="result-empty">
          문제 이미지를 올리고 <b>손글씨 해설 만들기</b>를 누르면 여기에 결과가 나옵니다.<br />
          풀이가 나온 뒤에는 펜·글씨체·합성 방식을 바꾸면 AI를 다시 부르지 않고 바로 다시 그립니다.
        </div>
        <img id="result-img" alt="손글씨 해설지 결과" hidden />
      </div>
      <details id="solution-text" class="solution-text" hidden>
        <summary>풀이 텍스트 보기</summary>
        <div id="solution-body"></div>
      </details>
    </section>
  </main>

  <script src="/app.js" type="module"></script>
</body>
</html>
